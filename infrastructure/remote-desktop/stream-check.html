<!doctype html><meta charset="utf-8"><title>Mengel stream check</title>
<style>body{margin:0;background:#161616;color:#eee;font:24px system-ui;text-align:center}main{padding:100px 40px}button{font:inherit;padding:14px 24px;border:1px solid #666;border-radius:10px;background:#333;color:#fff}#track{height:100px;position:relative;margin:60px auto;width:80%;border-bottom:1px solid #555}#dot{position:absolute;width:42px;height:42px;background:#ddd;border-radius:50%;top:25px}#pulse{display:inline-block;width:24px;height:24px;border-radius:50%;background:#444;margin-right:12px}small{display:block;color:#aaa;margin:24px}</style>
<main><h1>Remote stream check</h1><p><span id="pulse"></span>Smooth motion and synchronized sound</p><button id="sound">Start sound check</button><div id="track"><div id="dot"></div></div><p id="fps"></p><small id="gpu"></small></main>
<script>
const canvas=document.createElement('canvas'),gl=canvas.getContext('webgl');const ext=gl?.getExtension('WEBGL_debug_renderer_info');gpu.textContent=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'WebGL unavailable';
let frames=0,last=performance.now(),context=null,lastBeat=-1; sound.onclick=()=>{context??=new AudioContext();context.resume();sound.textContent='Sound check running'};
function tick(t){frames++;dot.style.left=(50+45*Math.sin(t/600))+'%';if(t-last>1000){fps.textContent='Browser rendering: '+Math.round(frames*1000/(t-last))+' fps';frames=0;last=t}const beat=Math.floor(t/2000);pulse.style.background=t%2000<150?'#fafafa':'#444';if(context&&beat!==lastBeat){lastBeat=beat;const tone=context.createOscillator(),gain=context.createGain();tone.frequency.value=440;gain.gain.setValueAtTime(.08,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.12);tone.connect(gain).connect(context.destination);tone.start();tone.stop(context.currentTime+.14)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
